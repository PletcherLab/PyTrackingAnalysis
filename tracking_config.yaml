global:
  # ── Required ──────────────────────────────────────────────────────────────
  #
  # Type of tracking performed.
  # Options: TRACKER | TWOCHOICETRACKER | XCHOICETRACKER | TWOCHOICECOUNTER |
  #          PAIRWISEINTERACTIONTRACKER | PAIRWISEINTERACTIONCOUNTER
  tracking_type: TRACKER

  # Hardware rig used. Sets fps and mm_per_pixel automatically.
  # Options: small_arena | arena_max | colosseum | obscura | movie
  # Use 'movie' and supply fps + mm_per_pixel manually below.
  tracking_rig: Colosseum

  # ── Experimental Design ───────────────────────────────────────────────────
  #
  # Factors and their levels. Used for documentation and plot labelling only;
  # the actual per-region assignments are in tracking_regions below.
  experimental_design_factors:
    feeding: [Starved, Control]
    sex: [Male, Female]

  # ── Optional: Faceted Analysis ────────────────────────────────────────────
  #
  # Minute boundaries that split the experiment into phases for faceted plots
  # and statistics. Remove this key if you do not want faceted analysis.
  # Example: [10, 70] creates three phases — 0-10 min, 10-70 min, 70+ min.
  facet_cutoffs: [10, 70]

  # Optional names for those phases, one per phase (= cutoffs + 1). Shown in
  # faceted figures, the report, and project summaries. Omit to use the
  # Experiment Type's defaults (Valence: Acclimation / Experiment / Cooldown)
  # or plain minute ranges.
  # facet_labels: [Acclimation, Experiment, Cooldown]

  # ── Optional: Parameter Overrides ─────────────────────────────────────────
  #
  # These override the values set by tracking_rig. Only specify what you need
  # to change from the rig defaults.
  #
  # Frames per second. Required when tracking_rig is 'movie'.
  # fps: 30
  #
  # Spatial calibration in mm per pixel. Required when tracking_rig is 'movie'.
  # mm_per_pixel: 0.1
  #
  # Window in seconds used to smooth speed calculations.
  # speed_window_seconds: 1
  #
  # Speed range [min, max] in mm/s that defines micro-movement (not resting,
  # not walking).
  # micromove_speed_mm_sec: [0.2, 2]
  #
  # Minimum speed in mm/s to be classified as walking.
  # walking_speed_mm_sec: 2
  #
  # Minimum continuous resting duration in minutes to be classified as sleep.
  # sleep_threshold_min: 5
  #
  # Distance thresholds (mm) used for interaction detection.
  # Applies to PAIRWISEINTERACTIONTRACKER and PAIRWISEINTERACTIONCOUNTER only.
  # (A Paired Open Field experiment defaults to [4, 8, 10].)
  # interaction_distances: [8]
  #
  # Pairwise trackers only (docs/adr/0014, 0015). A lost run bracketed by
  # distances below merge_distance_mm is two flies touching (0 = off).
  # merge_distance_mm: 3
  # Encounters: hysteresis above the threshold, gaps bridged, minimum length.
  # encounter_hysteresis_mm: 0.5
  # encounter_gap_s: 0.5
  # encounter_min_s: 0.5
  # Wall-contact ring and the body ellipse used for exploration (mm).
  # wall_zone_mm: 2.5
  # fly_length_mm: 2.5
  # fly_width_mm: 1.0
tracking_regions:
  T_0:

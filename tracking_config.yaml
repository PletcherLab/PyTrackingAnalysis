# tracking_config.yaml — one recording's configuration (a commented template).
#
# It lives at the root of an Experiment Directory, beside:
#   data/                 the DTrack export (unless data_folder: names another)
#   removed_regions.yaml  tracking regions left out of the analysis, each with
#                         a reason (docs/adr/0010, 0021). Never part of this
#                         file: tick Removed on the Config Editor's Tracking
#                         regions tab, or in the QC Viewer, to write it.
#
# A replicate in a Project may hold tracking_member.yaml instead of this file.
# Its config: names the recording's own tracking_config.yaml, so a recording
# has one config however many Projects analyse it (docs/adr/0020). Inside a
# Project with a design, only the global: keys that describe the recording
# (experiment_type, tracking_type, tracking_rig, fps, mm_per_pixel,
# experimental_design_factors) are read from here, and must agree with the
# design. Every other global: key is an analysis setting that comes from
# project.yaml's design.

# ── Optional: Data Folder (docs/adr/0018) ───────────────────────────────────
#
# Read the recording from another folder instead of the data/ beside this
# file, such as a locked run folder several studies share. Relative to this
# file's folder, with forward slashes. The folder is only read: analysis/,
# qc/ and the report are still written beside this file.
# data_folder: ../../../../../runs/tracking/2026/R-20261020-asmith-01/data

# ── Optional: About the Recording (docs/adr/0019) ───────────────────────────
#
# What this recording is, in your own words, for whoever reads this file
# later. Every key is optional, and no analysis reads any of it. The Config
# Editor's About tab fills it in, with Organism starting as Drosophila
# melanogaster. A catalogue that files the recording may add run: (its id
# there) and registry terms beside a level's definition.
# about:
#   title: Starvation and sex, replicate 1
#   purpose: Whether starvation changes how far flies walk.
#   experimenter: your-name
#   series: starvation-2026
#   organism: Drosophila melanogaster
#   sex: [female, male]
#   age_at_start: 5-7 days
#   protocol: {name: Open arena, version: "1", link: https://example.org/protocol}
#   notes: Free text.
#   factors:
#     feeding:
#       kind: diet          # genotype | treatment | diet | condition | sex | other
#       levels:
#         Starved: 24 h on 1% agar
#         Control: standard food
#     sex:
#       kind: sex

global:
  # ── Experiment Type (docs/adr/0001) ───────────────────────────────────────
  #
  # A named assay bundle that owns the tracking type, the allowed rigs, the
  # default phases and its quality criteria, and is validated when it loads.
  # Options: Custom | Valence | PairedOpenField. Custom when omitted: the
  # freeform behaviour driven by tracking_type below.
  # experiment_type: Custom

  # ── Required ──────────────────────────────────────────────────────────────
  #
  # Type of tracking performed.
  # Options: TRACKER | TWOCHOICETRACKER | XCHOICETRACKER | TWOCHOICECOUNTER |
  #          PAIRWISEINTERACTIONTRACKER | PAIRWISEINTERACTIONCOUNTER
  tracking_type: TRACKER

  # Hardware rig used. Sets fps and mm_per_pixel automatically.
  # Options: small_arena | arena_max | colosseum | obscura | movie
  # Use 'movie' and supply fps + mm_per_pixel manually below.
  tracking_rig: colosseum

  # ── Experimental Design ───────────────────────────────────────────────────
  #
  # Factors and their levels. Used for documentation and plot labelling only;
  # the actual per-region assignments are in tracking_regions below.
  experimental_design_factors:
    feeding: [Starved, Control]
    sex: [Male, Female]

  # ── Optional: Faceted Analysis ────────────────────────────────────────────
  #
  # Minute boundaries that split the experiment into phases for faceted plots
  # and statistics. Remove this key if you do not want faceted analysis.
  # Example: [10, 70] creates three phases — 0-10 min, 10-70 min, 70+ min.
  facet_cutoffs: [10, 70]

  # Optional names for those phases, one per phase (= cutoffs + 1). Shown in
  # faceted figures, the report, and project summaries. Omit to use the
  # Experiment Type's defaults (Valence: Acclimation / Experiment / Cooldown)
  # or plain minute ranges.
  # facet_labels: [Acclimation, Experiment, Cooldown]

  # ── Optional: Quality Criteria ────────────────────────────────────────────
  #
  # Read by the Experiment Type that defines them; 0 turns each one off.
  # Valence: flies with fewer transitions than this in the primary phase are
  # excluded from every result and listed in <name>_Excluded.csv.
  # min_transitions: 5
  # Valence: flies averaging under this many mm/min in the first phase are
  # flagged in LowMovementFlag, never removed.
  # min_movement: 140
  # Paired Open Field: a pair tracked for under this fraction of the primary
  # phase is excluded, both flies.
  # min_valid_fraction: 0.8

  # ── Optional: Directional Hypotheses (Valence; docs/adr/0017) ─────────────
  #
  # Predictions made before the data existed, tested one-sided. Each names
  # levels of one design factor (or one level against indifference); phases
  # defaults to the primary phase.
  # hypotheses:
  # - expect: Starved > Control
  #   phases: [Experiment]

  # ── Optional: Parameter Overrides ─────────────────────────────────────────
  #
  # These override the values set by tracking_rig. Only specify what you need
  # to change from the rig defaults.
  #
  # Frames per second. Required when tracking_rig is 'movie'.
  # fps: 30
  #
  # Spatial calibration in mm per pixel. Required when tracking_rig is 'movie'.
  # mm_per_pixel: 0.1
  #
  # Window in seconds used to smooth speed calculations.
  # speed_window_seconds: 1
  #
  # Speed range [min, max] in mm/s that defines micro-movement (not resting,
  # not walking).
  # micromove_speed_mm_sec: [0.2, 2]
  #
  # Minimum speed in mm/s to be classified as walking.
  # walking_speed_mm_sec: 2
  #
  # Minimum continuous resting duration in minutes to be classified as sleep.
  # sleep_threshold_min: 5
  #
  # Distance thresholds (mm) used for interaction detection.
  # Applies to PAIRWISEINTERACTIONTRACKER and PAIRWISEINTERACTIONCOUNTER only.
  # (A Paired Open Field experiment defaults to [4, 8, 10].)
  # interaction_distances: [8]
  #
  # Pairwise trackers only (docs/adr/0014, 0015). A lost run bracketed by
  # distances below merge_distance_mm is two flies touching (0 = off).
  # merge_distance_mm: 3
  # Encounters: hysteresis above the threshold, gaps bridged, minimum length.
  # encounter_hysteresis_mm: 0.5
  # encounter_gap_s: 0.5
  # encounter_min_s: 0.5
  # Wall-contact ring and the body ellipse used for exploration (mm).
  # wall_zone_mm: 2.5
  # fly_length_mm: 2.5
  # fly_width_mm: 1.0

# ── Tracking Regions ──────────────────────────────────────────────────────────
#
# One entry per tracking region (tube or well), named as DTrack names it.
# experimental_factors: one level of each design factor, comma-separated; a
# region left blank is unassigned and its flies are left out of the results.
# x/y_location_multiplier: 1, or -1 to flip a mirrored arena's coordinates.
# A region removed from the analysis stays here: removals are declared in
# removed_regions.yaml (see the top of this file).
tracking_regions:
  T_0:
    experimental_factors: Starved, Female
    x_location_multiplier: 1
    y_location_multiplier: 1

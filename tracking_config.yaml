# ── Counting Regions ──────────────────────────────────────────────────────────
#
# One entry per treatment label: alias lists every counting_region value in
# the data file that means that treatment.
counting_regions:
  Light:
    alias: Light, LL, L
  NoLight:
    alias: NoLight, NL, N
